<div class="page-container">
  <div class="page-header">
    <h2>Nuevo pago</h2>
    <a routerLink="/payments">Volver a la lista</a>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="payment-form">
    <div class="form-group">
      <label for="cardNumber">Número de tarjeta</label>
      <input id="cardNumber" type="text" formControlName="cardNumber" />
    </div>

    <div class="form-group">
      <label for="expirationDate">Fecha de vencimiento</label>
      <input id="expirationDate" type="text" formControlName="expirationDate" placeholder="MM/YY" />
    </div>

    <div class="form-group">
      <label for="cvv">CVV</label>
      <input id="cvv" type="text" formControlName="cvv" />
    </div>

    <div class="form-group">
      <label for="amount">Monto</label>
      <input id="amount" type="number" formControlName="amount" />
    </div>

    <div class="form-group">
      <label for="customerName">Nombre del cliente</label>
      <input id="customerName" type="text" formControlName="customerName" />
    </div>

    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Creando pago...' : 'Crear pago' }}
    </button>
  </form>
</div>
